[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edasynth"
version = "1.0.0"
description = "Semi-synthetic test bench: when does a wrist accelerometer help detect motion artifacts in electrodermal activity?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nuray Doskaliyeva" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
reference = ["cvxopt>=1.3", "wfdb>=4.1", "PyWavelets>=1.5"]   # cross-checks; cvxEDA.py itself: see README
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
edasynth = "edasynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs downloaded data and minutes; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
