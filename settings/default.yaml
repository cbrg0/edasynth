# This is the main settings file. Every number that can change a result is stored here.
# A comment says where a value comes from: a cited publication, a measurement on the
# recordings, or a decision of this study. study-description/METHOD.md explains each value.
# The file was fixed by the preregistration tags (study-description/PREREGISTRATION.md);
# only its comments and the folder names in the section paths have changed since.

paths:
  # The PhysioNet UTD recordings, downloaded by data-download-and-external-checks/download-data.sh.
  noneeg: downloaded-data/raw/noneeg-1.0.0
  # The repository of Zhang et al. at commit 7c4bd46, downloaded by the same script.
  zhang: downloaded-data/external/eda-artifact-detection
  results: result-tables
  figures: result-figures

data:
  # A participant is listed here only for a documented reason, such as a failed alignment.
  excludeSubjects: []
  # The smallest accepted correlation in the alignment check; a decision of the study.
  # On the AWW recordings the same check gives r = 1.0000.
  alignmentMinR: 0.999

seeds:
  grid: 20261022
  power: 7
  validation: 11

estimation:
  # The smallest size of a response in microsiemens, as accepted in the literature (Kleckner
  # et al., 2018; Boucsein et al., 2012, as summarised by Posada-Quintero & Chon, 2020).
  minResponseAmp: 0.05
  cvxeda:
    # The authors' cvxEDA.py is used if it can be imported, which needs cvxopt; otherwise the
    # built-in solver is used.
    backend: auto
    # The fast time constant in seconds, from Greco et al. (2016).
    tau1: 0.7
    # The range of the slow time constant in seconds, from Greco et al. (2016).
    tau0Min: 2.0
    tau0Max: 4.0
    # The step of the search in seconds; a decision of the study. tau0 is chosen by the
    # smallest value of the objective, while Greco et al. used the size of the remainder.
    tau0Step: 0.1
    # alpha, gamma and the distance between joints come from Greco et al. (2016). Scaling the
    # input to mean 0 and standard deviation 1 is a decision of the study.
    alpha: 8.0e-4
    gamma: 1.0e-2
    knotS: 10.0
  tonic:
    # The range of periods of the synthetic slow level of Greco et al. (2016), in seconds.
    periodMinS: 45
    periodMaxS: 90
    # The step of the search in seconds; a decision of the study.
    periodStepS: 1
  # How artifact episodes are measured and assigned to classes. These rules are decisions
  # of the study and were fixed before the data were inspected.
  episodes:
    baselineS: 2.0
    minAmp: 0.05
    shiftSigma: 3.0
    # The level in microsiemens below which the signal counts as lost; a decision of the study.
    dropoutLevel: 0.01
    # The upper limit in microsiemens, from rule 1 of Kleckner et al. (2018).
    saturationLevel: 60.0
    flatMinS: 1.0
    # Artifact sizes are stored relative to max(local level, levelFloor). The value is the
    # lower limit of rule 1 of Kleckner et al. (2018); using it here is a decision of the study.
    levelFloor: 0.05
    pnWalk: 0.5
    walkStages: [physical, walk]
  # Who may serve as a physiology donor; a decision of the study (METHOD.md, section 4.1).
  donor:
    # The lower limit in microsiemens, from rule 1 of Kleckner et al. (2018).
    minLevel: 0.05
    # A recording is excluded when more than half of its samples lie below minLevel.
    maxShareBelow: 0.5
  noise:
    # Each noise block covers one window of five seconds, or 40 samples; a decision of the study.
    blockS: 5.0
  motion:
    # The percentile of the jerk at rest above which a movement event starts; a decision of the
    # study. The values 95 and 99.9 are foreseen for a check of how much this choice matters.
    percentile: 99
    # The shortest event, 4 samples or half a second.
    minLen: 4
    mergeS: 1.0
  plausibility:
    # A warning is printed above this rate of responses per minute, but the program does not
    # stop; a decision of the study. The range in the literature has not yet been verified.
    maxRatePerMin: 10.0
  reference:
    # The time around a movement, in seconds, used to describe the UTD labels; a decision.
    windowS: [-1.0, 5.0]
  c4:
    # The fast part of a signal is the signal minus its moving mean over 2 seconds; a decision.
    smoothS: 2.0
    stages: [physical, walk]

generator:
  tau1: 0.7
  # The Bateman response is computed over 10 tau0, after which it has fallen to about 5e-5.
  kernelTauMultiple: 10
  # The delay of a response after a stimulus, from Boucsein et al. (2012) as summarised by
  # Posada-Quintero & Chon (2020). Applying it to movement is an assumption.
  motionResponseLatencyS: [1.0, 5.0]
  # A sample counts as corrupted when the artifact moves it by this many microsiemens, the
  # smallest visible response; a decision of the study.
  labelThreshold: 0.05
  # The noise consists of blocks of the donor's decomposition remainder; a decision. The
  # alternative, gaussian, uses normal noise with the donor's sigma.
  noise: residualBootstrap
  # The local level is the median of the clean signal over the 5 seconds before an artifact.
  levelWindowS: 5.0
  c4:
    # A decision of the study: with control, the gain is set by controlTargetUs; with
    # measured, it is the gain measured on UTD, which is about zero.
    gain: control
    # The median movement event gives a C4 artifact of median size 0.1 microsiemens, twice the
    # label threshold; a decision of the study.
    controlTargetUs: 0.1
  # The largest share of the signal that an artifact can remove.
  rhoMax: 0.95
  saturationLevel: 60.0
  maxArtifactsPerParticipant: 400
  # This is true only for development runs without measured templates.
  allowFallbackTemplates: false
  fallbackTemplates: {}

features:
  # Central differences, as in the published script of Zhang et al.; forward differences
  # reproduce their stored tables.
  derivative: central
  fb:
    maxLagS: 5.0
    contextS: 5.0
    medianS: 60.0
    cohBand: [0.5, 3.0]
    cohSegS: 2.5

models:
  logreg:
    CGrid: [0.01, 0.1, 1.0, 10.0]
    # A decision of version 1.4.0: C is fixed at CDefault, as in the comparison on real data.
    # Before, C was chosen from CGrid by an inner cross-validation grouped by participant.
    CSelection: fixed
    # This solver minimises the same objective as lbfgs and was measured to be about 20 times
    # faster on these features.
    solver: newton-cholesky
    # The inner cross-validation uses 5 folds grouped by participant; a decision. The option
    # loso is also allowed and is about 4 times slower.
    innerFolds: 5
    CDefault: 1.0
    classWeight: balanced
    maxIter: 5000
  rf:
    nEstimators: 500
    classWeight: null
    nJobs: 1

# These settings reproduce the published comparison on real data.
realdata:
  models:
    logreg: {CGrid: [1.0], CSelection: fixed, innerFolds: 5, CDefault: 1.0, classWeight: balanced, maxIter: 5000, solver: newton-cholesky}
    rf: {nEstimators: 500, classWeight: null, nJobs: -1}
  nShuffles: 20

analysis:
  specificity: 0.95
  bootstrapN: 1000
  # The accelerometer is useful in a cell when the mean gain is at least 0.01 and the lower
  # bound of the 95 % interval is above zero.
  decision: {minDelta: 0.01}
  # The real gain on UTD, with the stored features and logistic regression.
  observedDelta: 0.027
  # The measured agreement of the three UTD experts (Fleiss' kappa). Using it as a target for
  # noisy labels is an assumption.
  labelNoiseKappa: 0.62
  sensitivityReference: {c: 0.5, kappa: 1.0, deltaMax: 1.0, piR: 0.0}

grid:
  c: [0.0, 0.25, 0.5, 0.75, 1.0]
  kappa: [0.0, 1.0]
  # The value of 10 seconds, added in version 1.4.0, lies beyond the 5-second window of the
  # coupling features.
  deltaMax: [1.0, 5.0, 10.0]
  piR: [0.0, 0.5]
  # The last composition is the mixture in the shares measured on UTD.
  compositions: [[C1], [C2], [C3], [C5], [C1, C2, C3, C5]]
  prevalence: 0.038

variants:
  c: [0.0, 0.5, 1.0]
  # The share of artifacts in the AWW resting recordings (Zhang et al., 2017).
  highPrevalence: 0.15

pilot:
  reps: 10
  halfWidth: 0.005
  maxReps: 50

power:
  nConditions: 3
  participants: [5, 10, 15, 20]
  reps: 50

validation:
  shiftMinS: 60
  controlReps: 10
  g2Participants: 20
  g2Tau0MaxErrS: 0.3
  g2RateMaxRel: 0.2
  g2KsP: 0.05
  c2stAucMax: 0.70
  # A decision of version 1.4.0: the median AUC over 10 repetitions is used, because a single
  # repetition varied from 0.49 to 0.73 between random seeds.
  realismReps: 10
  # A decision of version 1.4.0: G3 and G4 use a generator built without the participant it is
  # compared with. The comparison between halves of the participants is reported as well.
  realism: loso
  # A decision of version 1.4.0: G2 is also run with responses whose time constants differ
  # from the ones cvxEDA assumes.
  g2Jitter: {tau0Rel: 0.25, tau1Range: [0.35, 1.05]}
  g5MaxAbsDelta: 0.01
  g7Reference: {auprc0: 0.449, auprc1: 0.475, delta: 0.027}
  g7MaxAbsDiff: 0.10
