# SMOKE configuration: proves that the whole pipeline runs end to end in minutes.
# It uses AWW (one person, recording days as "participants") instead of UTD and
# tiny grids. Its numbers are NOT results and must never be reported as such.
# Usage: python -m edasynth --config configs/smoke.yaml <command> --source aww

paths:
  noneeg: data/raw/noneeg-1.0.0
  zhang: data/external/eda-artifact-detection
  results: results/smoke
  figures: figures/smoke

data: {excludeSubjects: [], alignmentMinR: 0.999}
seeds: {grid: 1, power: 2, validation: 3, detectors: 4}

estimation:
  minResponseAmp: 0.05
  cvxeda: {backend: auto, tau1: 0.7, tau0Min: 2.0, tau0Max: 4.0, tau0Step: 1.0, alpha: 8.0e-4, gamma: 1.0e-2, knotS: 10.0}
  tonic: {periodMinS: 45, periodMaxS: 90, periodStepS: 5}
  episodes: {baselineS: 2.0, minAmp: 0.05, shiftSigma: 3.0, dropoutLevel: 0.01, saturationLevel: 60.0, flatMinS: 1.0, pnWalk: 0.5, walkStages: [physical, walk]}
  motion: {percentile: 99, minLen: 4, mergeS: 1.0}
  plausibility: {maxRatePerMin: 10.0}
  reference: {windowS: [-1.0, 5.0]}
  c4: {smoothS: 2.0, stages: [physical, walk]}

generator:
  tau1: 0.7
  kernelTauMultiple: 10
  motionResponseLatencyS: [1.0, 5.0]
  labelThreshold: 0.05
  rhoMax: 0.95
  saturationLevel: 60.0
  maxArtifactsPerParticipant: 400
  allowFallbackTemplates: true      # smoke only: AWW may lack some classes
  fallbackTemplates:                 # placeholder shapes for the smoke run only; not used in real runs
    C1: {A: [0.1, 1.0], tauR: [0.2, 1.0], tauF: [0.5, 3.0]}
    C2: {depth: [0.1, 1.0], w: [0.125, 1.0], D: [1.0, 5.0]}
    C3: {delta: [-0.8, 0.8], w: [0.125, 1.0]}
    C5: {D: [1.0, 5.0], kind: zero}

features:
  derivative: central
  fb: {maxLagS: 5.0, contextS: 5.0, medianS: 60.0, cohBand: [0.5, 3.0], cohSegS: 2.5}

models:
  logreg: {CGrid: [0.1, 1.0], CSelection: inner, innerFolds: 3, CDefault: 1.0, classWeight: balanced, maxIter: 2000, solver: newton-cholesky}
  rf: {nEstimators: 50, classWeight: null, nJobs: 1}

realdata:
  models:
    logreg: {CGrid: [1.0], CSelection: fixed, innerFolds: 5, CDefault: 1.0, classWeight: balanced, maxIter: 5000, solver: newton-cholesky}
    rf: {nEstimators: 50, classWeight: null, nJobs: -1}
  nShuffles: 2

analysis:
  specificity: 0.95
  bootstrapN: 200
  decision: {minDelta: 0.01}
  observedDelta: 0.027
  labelNoiseKappa: 0.62
  sensitivityReference: {c: 0.5, kappa: 1.0, deltaMax: 1.0, piR: 0.0}

grid:
  c: [0.0, 1.0]
  kappa: [1.0]
  deltaMax: [1.0]
  piR: [0.0, 0.5]
  compositions: [[C1], [C1, C2, C3, C5]]
  prevalence: 0.038

variants: {c: [0.0, 1.0], highPrevalence: 0.15}
pilot: {reps: 2, halfWidth: 0.005, maxReps: 3}
power: {nConditions: 1, participants: [5, 11], reps: 2}

validation:
  shiftMinS: 60
  controlReps: 3
  g2Participants: 3
  g2Tau0MaxErrS: 0.3
  g2RateMaxRel: 0.2
  g2KsP: 0.05
  c2stAucMax: 0.70
  g5MaxAbsDelta: 0.01
  g7Reference: {auprc0: 0.449, auprc1: 0.475, delta: 0.027}
  g7MaxAbsDiff: 0.10

detectors:
  classes: [C1, C2, C3, C4, C5]
  kleckner: {firSeconds: 64, cutoffHz: 0.35, levelMin: 0.05, levelMax: 60.0, slopeMax: 10.0, transitionS: 5.0}
  kocielnik: {risePerS: 0.20, fallPerS: 0.10}
  chen: {levels: 8, delta: 0.01, windowS: 400}
